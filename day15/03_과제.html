<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>야구게임</title>
</head>
<body>
  <button type="button" class="start">새 게임</button>
  <h1 id="status"></h1>
  <div class="inputContainer"></div>
  <ol id="result"></ol>
  <script>
    const toFind = [];
    let gameOver = false;
    
    // 게임 시작
    document.querySelector('.start').addEventListener('click', () => {
      if (toFind.length != 0 && !gameOver) {
        if (!confirm('아직 진행중인 게임이 있습니다. 처음부터 다시 하시겠습니까?')) {
          return;
        }
      }

      let numSet = new Set();
      while (numSet.size < 3) {
        numSet.add(Math.floor(Math.random()*10));
      }
      toFind.splice(0, 3);
      for (const num of numSet) {
        toFind.push(num);
      }

      document.getElementById('status').innerText = '컴퓨터가 숫자를 결정하였습니다.';
      document.querySelector('.inputContainer').innerHTML = '숫자 입력 : <input type="text"><button type="button" onclick="getScore()">게임 확인</button>';
      document.getElementById('result').innerHTML = '';
      document.querySelector('input').focus();
      gameOver = false;
    });

    // 게임 확인
    function getScore() {
      let inputArr = document.querySelector('input').value.split('');
      try {
        // 1. 입력을 array로 변환 후 유효성 검사
        // 아예 숫자가 아닌 경우 Number()와 parseInt() 둘 다 NaN이지만, 둘이 다르다고 판단하기 때문에 여기서 걸러진다.
        for (let i = 0; i < 3; i++) {
          let replace = Number(inputArr[i]);
          if (replace != parseInt(inputArr[i])) throw new Error('숫자 3개를 입력해주세요.');
          inputArr[i] = replace;
        }
        if (new Set(inputArr).size < 3) throw new Error('중복된 숫자가 있습니다.');

        // 2. result = [스트라이크, 볼] 계산
        const result = [0, 0];

        for (let i = 0; i < 3; i++) {
          for (let j = 0; j < 3; j++) {
            if (inputArr[i] != toFind[j]) continue;

            if (i == j) result[0]++;
            else result[1]++;
          }
        }

        // 3. 결과 출력
        let resultText = '';
        switch (result[0]) {
          case 3:
            resultText = '성공';
            break;
          case 0:
            resultText = (result[1] == 0) ? 'OUT' : result[1] + 'B';
            break;
          default:
            resultText = result[0] + 'S';
            if (result[1] > 0) resultText += ` ${result[1]}B`;
        }
        document.getElementById('result').innerHTML += `<li>${inputArr.join(',')} : ${resultText}</li>`;

        document.querySelector('#status').innerText = document.querySelector('ol').childElementCount + '회차';
        if (result[0] == 3) {
          document.querySelector('.inputContainer').innerHTML = '';
          gameOver = true;
        } else {
          document.querySelector('input').value = '';
        }
      } catch (error) {
        document.getElementById('status').innerText = error.message;
      }
    }
  </script>
</body>
</html>
