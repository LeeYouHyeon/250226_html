<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calc</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <div class="printResult">
      <div class="expression"></div>
      <div class="intermediate"></div>
      <div class="icons">
        <button type="button" class="logBtn">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-clock"
            viewBox="0 0 16 16">
            <path d="M8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71z" />
            <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16m7-8A7 7 0 1 1 1 8a7 7 0 0 1 14 0" />
          </svg>
        </button>
        <button type="button" class="backspace" onclick="removeLast()">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-backspace"
            viewBox="0 0 16 16">
            <path
              d="M5.83 5.146a.5.5 0 0 0 0 .708L7.975 8l-2.147 2.146a.5.5 0 0 0 .707.708l2.147-2.147 2.146 2.147a.5.5 0 0 0 .707-.708L9.39 8l2.146-2.146a.5.5 0 0 0-.707-.708L8.683 7.293 6.536 5.146a.5.5 0 0 0-.707 0z" />
            <path
              d="M13.683 1a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-7.08a2 2 0 0 1-1.519-.698L.241 8.65a1 1 0 0 1 0-1.302L5.084 1.7A2 2 0 0 1 6.603 1zm-7.08 1a1 1 0 0 0-.76.35L1 8l4.844 5.65a1 1 0 0 0 .759.35h7.08a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1z" />
          </svg>
        </button>
      </div>
    </div>
    <div class="buttons"></div>
  </div>
  <h3>※ %는 나머지 연산자입니다.</h3>
  <div class="logs invisible">기록이 없습니다.</div>
  <script>
    // .buttons 채우기
    for (let item of ['C', '()', '%', '÷', '7', '8', '9', '×', '4', '5', '6', '-', '1', '2', '3', '+', '+/-', '0', '.', '=']) {
      let insert = `<button type="button" value="${item}"`;
      if (item == 'C') {
        insert += 'class="charBtn red"';
      } else if (item == '=') {
        insert += 'id="equalBtn"';
      } else if (item == '+/-' || item == '.') {
        insert += 'class="numBtn"';
      } else if (isNaN(Number(item))) {
        insert += 'class="charBtn"';
      } else {
        insert += 'class="numBtn"';
      }
      insert += `>${item}</button`;
      document.querySelector('.buttons').innerHTML += insert;
    }

    const numbers = []; // 입력하는 식을 저장하는 array
    let result = ''; // 계산 결과를 string으로 저장
    const logs = []; // 계산 이력. unshift()를 이용해 나중에 처리된 기록이 앞에 오게 함.

    // 에러 상황들
    const zeroDivide = new Error('0으로 나눌 수 없습니다.'),
      incomplete = new Error('수식이 완성되지 않았습니다.');
  </script>
  <script src="./classes.js"></script>
  <script src="./print.js"></script>
  <script src="./calculation.js"></script>
  <script src="./logs.js"></script>
  <script src="./numbers_IO.js"></script>
</body>

</html>
