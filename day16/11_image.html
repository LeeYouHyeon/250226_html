      display: flex;

    }
    img{

<body>
  <header>Travel</header>
  <ul>
    <li><button type="button" value="home">Home</button></li>
    <li><button type="button" value="seoul">Seoul</button></li>
    <li><button type="button" value="tokyo">Tokyo</button></li>
    <li><button type="button" value="paris">Paris</button></li>
  </ul>
  <div class="imageContainer">
    <img src="../image/비행기.jpg" alt="비행기사진">
  </div>
  <script>
    class Image {
      constructor(src, alt) {
        this.src = src;
        this.alt = alt;
      }
    }
    const images = {
      home: new Image('../image/비행기.jpg', '비행기사진'),
      seoul: new Image('../image/서울.jpg', '서울사진'),
      tokyo: new Image('../image/도쿄.jpg', '도쿄사진'),
      paris: new Image('../image/파리.jpeg', '파리사진')
    };

    document.querySelectorAll('button').forEach(e => {
      e.addEventListener('click', () => {
        const image = document.querySelector('img');
        image.src = images[e.value].src;
        image.alt = images[e.value].alt;
      })
    });
  </script>
</body>
