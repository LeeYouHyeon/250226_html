<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배달의 민족</title>
  <style>
    /* font link */
    @font-face {
      font-family: Jua;
      src: url(../fonts/Jua/Jua-Regular.ttf);
    }

    body{
      background-color: rgb(248, 239, 224);
      font-family: Jua, seif;
    }
    .container{
      margin: 0 auto;
      width: 500px;
      text-align: center;
    }
    .header>h1{
      font-size: 50px;
    }
    .header>h3{
      font-size: 35px;
    }
    .menu{
      width: 300px;
      margin: 0 auto 50px;
    }
    .img{
      width: 300px;
      height: 200px;
      margin: 0 auto;
      border-radius: 10px 10px 0 0;
      background-size: 100%;
    }
    #sushi{
      background-image: url("./images/초밥.jpg");
    }
    #chicken{
      background-image: url("./images/치킨.jpg");
    }
    #hamburger{
      background-image: url("./images/햄버거.jpg");
    }
    #curtlet{
      background-image: url("./images/돈가스.jpg");
    }
    .desc{
      width: 300px;
      background-color: white;
      padding-bottom: 20px;
      padding-top: 20px;
      border-radius: 0 0 5px 5px;
    }
    .desc>p{
      font-size: 16px;
      font-weight: 600;
      padding-left: 20px;
      padding-right: 20px;
    }
    .desc>p:last-child{
      color: blue;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>코딩의 민족</h1>
      <h3>넌 코딩할 때가 가장 이뻐</h3>
    </div>
    <!-- 하나의 메뉴 박스-->
    <div class="menu">
      <div class="img" id="chicken"></div>
      <div class="desc">
        <h2>코딩에 빠진 닭</h2>
        <p>주머니가 가벼운 당신의 마음까지 생각한 착한 가격!</p>
        <p>바로 결제</p>
      </div>
    </div>
    <div class="menu">
      <div class="img" id="sushi"></div>
      <div class="desc">
        <h2>코코 스시</h2>
        <p>주머니가 가벼운 당신의 마음까지 생각한 착한 가격!</p>
        <p>바로 결제</p>
      </div>
    </div>
    <!-- 5개 생성 -->
    <div class="menu">
      <div class="img" id="hamburger"></div>
      <div class="desc">
        <h2>코데리아</h2>
        <p>주머니가 가벼운 당신의 마음까지 생각한 착한 가격!</p>
        <p>바로 결제</p>
      </div>
    </div>
    <div class="menu">
      <div class="img" id="curtlet"></div>
      <div class="desc">
        <h2>코가네</h2>
        <p>주머니가 가벼운 당신의 마음까지 생각한 착한 가격!</p>
        <p>바로 결제</p>
      </div>
    </div>
  </div>
</body>
</html>
