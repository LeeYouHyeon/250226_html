<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./reset.css">
  <style>
    ol,
    ul,
    li {
      list-style: none;
    }

    body {
      display: flex;
    }

    .sidebar {
      width: 15%;
      background-color: black;
      color: white;
      height: 100vh;
    }

    .sidebar>h3 {
      text-align: center;
      margin: 40px 0 50px;
      font-size: 30px;
    }

    .sidebar li {
      margin: 25px 10px;
    }
    .sidebar li>a{
      color: rgba(255, 255, 255, 0.5);
    }

    .sidebar>.icons {
      margin-top: 50px;
      position: relative;
    }

    .sidebar>.icons>a {
      position: absolute;
    }

    .sidebar a:first-of-type {
      left: 35%;
      transform: translateX(-50%);
    }

    .sidebar a:last-of-type {
      right: 35%;
      transform: translateX(-50%);
    }

    .main{
      width: 85%;
      background: linear-gradient(rgba(0, 0, 0, 0.048), rgba(0, 0, 0, 0.411)), url(./images/건물내부.jpg);
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .main>h3{
      color: white;
      font-size: 50px;
    }
    .main button{
      margin: 40px;
      font-size: 20px;
      color: white;
      background-color: transparent;
      padding: 15px 40px;
      border: 2px solid white;
    }
  </style>
</head>

<body>
  <div class="sidebar">
    <h3>능력단위테스트</h3>
    <ul>
      <li><a href="">HOME</a></li>
      <li><a href="">HTML5</a></li>
      <li><a href="">CSS3</a></li>
      <li><a href="">JAVASCRIPT</a></li>
      <li><a href="">BOOTSTRAP4</a></li>
    </ul>
    <div class="icons">
      <a href="">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#ffffff" class="bi bi-facebook"
          viewBox="0 0 16 16">
          <path
            d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951" />
        </svg>
      </a>
      <a href="">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#ffffff" class="bi bi-twitter"
          viewBox="0 0 16 16">
          <path
            d="M5.026 15c6.038 0 9.341-5.003 9.341-9.334q.002-.211-.006-.422A6.7 6.7 0 0 0 16 3.542a6.7 6.7 0 0 1-1.889.518 3.3 3.3 0 0 0 1.447-1.817 6.5 6.5 0 0 1-2.087.793A3.286 3.286 0 0 0 7.875 6.03a9.32 9.32 0 0 1-6.767-3.429 3.29 3.29 0 0 0 1.018 4.382A3.3 3.3 0 0 1 .64 6.575v.045a3.29 3.29 0 0 0 2.632 3.218 3.2 3.2 0 0 1-.865.115 3 3 0 0 1-.614-.057 3.28 3.28 0 0 0 3.067 2.277A6.6 6.6 0 0 1 .78 13.58a6 6 0 0 1-.78-.045A9.34 9.34 0 0 0 5.026 15" />
        </svg>
      </a>

    </div>
  </div>
  <div class="main">
    <h3>Welcome to Front-End World!</h3>
    <a href=""><button type="button">Learn More</button></a>
  </div>
</body>

</html>
